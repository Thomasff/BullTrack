plugins {
    id 'com.android.application'
}

def enableDebugImages = true

android {
    namespace = "com.zheng.bulltrack"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.zheng.bulltrack"
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "ENABLE_DEBUG_IMAGES", enableDebugImages.toString()

        externalNativeBuild {
            cmake {
                cppFlags += "-std=c++17"
                arguments += [
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_TOOLCHAIN=clang",
                    "-DBT_ENABLE_DEBUG_IMAGES=${enableDebugImages ? 'ON' : 'OFF'}"
                ]
            }
        }

        ndk {
            abiFilters += ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    sourceSets {
        main {
            java.srcDirs = ["src/validationShell/java"]
            kotlin.srcDirs = ["src/validationShell/java"]
            manifest.srcFile("src/main/AndroidManifest.xml")
            res.srcDirs = ["src/main/res"]
            assets.srcDirs = ["src/main/assets"]
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

dependencies {
    implementation project(":bulltrack-core")
    implementation "androidx.core:core-ktx:1.10.1"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
