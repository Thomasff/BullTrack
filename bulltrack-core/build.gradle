plugins {
    id 'com.android.library'
}

if (extensions.findByName("kotlin") == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

def enableDebugImages = true
def configuredCompileSdk = (rootProject.ext.has("compileSdkVersion") ? rootProject.ext.get("compileSdkVersion")?.toString()?.toInteger() : null) ?: 35
def configuredMinSdk = (rootProject.ext.has("minSdkVersion") ? rootProject.ext.get("minSdkVersion")?.toString()?.toInteger() : null) ?: 26
def configuredNdkVersion = (rootProject.ext.has("ndkVersion") ? rootProject.ext.get("ndkVersion")?.toString() : null) ?: "27.1.12297006"

android {
    namespace = "io.github.thomasff.bulltrack.core"
    compileSdk = configuredCompileSdk
    ndkVersion = configuredNdkVersion

    defaultConfig {
        minSdk = configuredMinSdk
        buildConfigField "boolean", "ENABLE_DEBUG_IMAGES", enableDebugImages.toString()

        externalNativeBuild {
            cmake {
                cppFlags += "-std=c++17"
                arguments += [
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_TOOLCHAIN=clang",
                    "-DBT_ENABLE_DEBUG_IMAGES=${enableDebugImages ? 'ON' : 'OFF'}"
                ]
            }
        }

        ndk {
            abiFilters += ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            consumerProguardFiles("consumer-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "com.google.guava:guava:33.2.1-android"
}
